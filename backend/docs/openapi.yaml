  securitySchemes:
    bearerAuth:
      type: http
      description: "Insérez votre jeton d'accès brut obtenu lors de la connexion."
      bearerFormat: JWT
      scheme: bearer
  schemas:
    SignalementTypeDechet:
      type: object
      properties:
        id:
          type: integer
        type_dechet_id:
          type: integer
        libelle:
          type: string
        description:
          type: string
          nullable: true
        quantite_estime:
          type: number
          nullable: true
        volume_estime:
          type: number
          nullable: true
        dangerosite:
          type: string
          nullable: true
          enum: [faible, modere, eleve, extreme]
        remarque:
          type: string
          nullable: true

    Signalement:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
          nullable: true
        latitude:
          type: number
        longitude:
          type: number
        statut:
          type: string
          enum: [brouillon, en_attente_validation, valide, rejete, priorise, affecte, en_intervention, termine, cloture]
        priorite:
          type: string
          nullable: true
          enum: [faible, normale, haute, urgente]
        user:
          type: object
          nullable: true
        zone:
          type: object
          nullable: true
        type_dechets:
          type: array
          items:
            $ref: '#/components/schemas/SignalementTypeDechet'
        photos:
          type: array
          items:
            type: object
        created_at:
          type: string
          nullable: true
        date_heure_signalement:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true

    CreateSignalementRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        description:
          type: string
          nullable: true
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        zone_id:
          type: integer
          nullable: true
        type_dechets:
          type: array
          items:
            type: object
            required:
              - type_dechet_id
            properties:
              type_dechet_id:
                type: integer
              quantite_estime:
                type: number
                minimum: 0
                nullable: true
              volume_estime:
                type: number
                minimum: 0
                nullable: true
              dangerosite:
                type: string
                nullable: true
                enum: [faible, modere, eleve, extreme]
              remarque:
                type: string
                nullable: true
        photos:
          type: array
          items:
            type: string
            format: binary

    UpdateSignalementRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
        zone_id:
          type: integer
          nullable: true
        type_dechets:
          type: array
          items:
            type: object
            required:
              - type_dechet_id
            properties:
              type_dechet_id:
                type: integer
              quantite_estime:
                type: number
                minimum: 0
                nullable: true
              volume_estime:
                type: number
                minimum: 0
                nullable: true
              dangerosite:
                type: string
                nullable: true
                enum: [faible, modere, eleve, extreme]
              remarque:
                type: string
                nullable: true

    PrioritizeSignalementRequest:
      type: object
      required:
        - priorite
      properties:
        priorite:
          type: string
          enum: [faible, normale, haute, urgente]

tags:
  - name: Authentification
    description: Authentification
  - name: Administration
    description: Administration
  - name: 'Types Déchets'
    description: 'Types Déchets'
  - name: Zones
    description: Zones
  - name: Équipes
    description: Équipes
  - name: Signalements
    description: Signalements
  - name: Affectations
    description: Affectations
  - name: Interventions
    description: Interventions
  - name: Gamification
    description: Gamification
  - name: Notifications
    description: Notifications
