<header class="sticky top-0 z-40 flex h-[70px] items-center justify-between border-b border-ier-border bg-[#0b0d10]/92 px-3 backdrop-blur-xl sm:px-5 xl:px-7">
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      class="grid size-10 shrink-0 place-items-center rounded-xl border border-ier-border bg-ier-surface text-ier-muted transition hover:border-ier-cyan/30 hover:text-white lg:hidden"
      (click)="toggleSidebar.emit()"
      aria-label="Menu principal">
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M3 6h18"></path>
        <path d="M3 12h18"></path>
        <path d="M3 18h18"></path>
      </svg>
    </button>

    <div class="min-w-0">
      <div class="text-[0.61rem] font-bold uppercase tracking-[0.12em] text-ier-cyan">Portail administrateur</div>
      <div class="truncate font-heading text-sm font-semibold text-white sm:text-base">Console de supervision</div>
    </div>
  </div>

  <div class="flex items-center gap-2 sm:gap-3">
    @if (currentUser(); as user) {
      <div class="hidden items-center gap-2.5 rounded-xl border border-ier-border bg-ier-surface px-2.5 py-1.5 sm:flex">
        <div class="grid size-8 place-items-center rounded-lg border border-ier-cyan/20 bg-ier-cyan/10 text-xs font-bold uppercase text-ier-cyan">
          {{ (user.prenom?.charAt(0) || '') + (user.nom?.charAt(0) || 'A') }}
        </div>
        <div class="min-w-0">
          <div class="truncate text-xs font-semibold text-white">{{ user.prenom }} {{ user.nom }}</div>
          <div class="text-[0.62rem] text-ier-muted">{{ user.role || 'admin' }}</div>
        </div>
      </div>
    }

    <button
      id="btn-logout"
      type="button"
      class="inline-flex items-center gap-2 rounded-xl border border-ier-border bg-ier-surface px-3 py-2 text-xs font-semibold text-ier-muted transition hover:border-ier-red/30 hover:bg-ier-red/10 hover:text-red-200 disabled:cursor-wait disabled:opacity-60"
      (click)="onLogout()"
      [disabled]="isLoggingOut()"
      title="Se déconnecter">
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span class="hidden sm:inline">Déconnexion</span>
    </button>
  </div>
</header>
