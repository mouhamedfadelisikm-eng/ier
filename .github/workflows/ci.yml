name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Backend + Frontend + Contracts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ier_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ier_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ier_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force

      - name: Run backend tests
        working-directory: backend
        run: php artisan test

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web-admin/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/web-admin
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend/web-admin
        run: npm run test -- --watch=false --no-progress

      - name: Build frontend
        working-directory: frontend/web-admin
        run: npm run build

      - name: Verify Web Admin contains no placeholder modules
        shell: bash
        run: |
          if grep -RIn "ModulePlaceholderComponent" frontend/web-admin/src/app; then
            echo "Obsolete placeholder reference detected."
            exit 1
          fi

      - name: Reject forbidden browser dialogs in Web Admin
        shell: bash
        run: |
          if grep -RInE '\balert\s*\(|\bwindow\.confirm\s*\(' frontend/web-admin/src/app; then
            echo "Forbidden alert/window.confirm usage detected."
            exit 1
          fi

      - name: Validate OpenAPI JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('backend/docs/openapi.json', 'utf8')); console.log('openapi.json: valid JSON')"

      - name: Validate OpenAPI YAML
        run: |
          ruby -e "require 'yaml'; YAML.load_file('backend/docs/openapi.yaml'); puts 'openapi.yaml: valid YAML'"

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

# Web Admin certification workflow
